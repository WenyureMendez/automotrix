{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h4 class="fw-bold mb-4">{{ action }} Seguro</h4>
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Compañía *</label>
                        <input type="text" name="company_name" class="form-control" value="{{ obj.company_name|default:'' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Número de Póliza *</label>
                        <input type="text" name="policy_number" class="form-control" value="{{ obj.policy_number|default:'' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Fecha Inicio *</label>
                        <input type="date" name="start_date" class="form-control" value="{{ obj.start_date|date:'Y-m-d'|default:'' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Fecha Fin *</label>
                        <input type="date" name="end_date" class="form-control" value="{{ obj.end_date|date:'Y-m-d'|default:'' }}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Vehículo *</label>
                        <select name="vehicle" class="form-select" required>
                            <option value="">Seleccione un vehículo</option>
                            {% for v in vehicles %}
                            <option value="{{ v.id }}" {% if obj.vehicle_id == v.id %}selected{% endif %}>
                                {{ v.brand }} {{ v.model }} - {{ v.plate }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <a href="{% url 'insurances_list' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success"><i class="bi bi-floppy me-1"></i> Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
