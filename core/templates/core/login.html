{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Motors — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(255,100,0,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(255,100,0,0.05) 0%, transparent 50%);
            pointer-events: none;
        }
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,100,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,100,0,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }
        .login-wrapper {
            width: 100%;
            max-width: 460px;
            padding: 20px;
            position: relative;
            z-index: 10;
        }
        .login-card {
            background: linear-gradient(135deg, #1a1a1a 0%, #111111 100%);
            border: 1px solid rgba(255,100,0,0.2);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 
                0 0 40px rgba(255,100,0,0.1),
                0 20px 60px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid rgba(255,100,0,0.5);
            box-shadow: 0 0 20px rgba(255,100,0,0.3);
            margin-bottom: 16px;
        }
        .brand-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .brand-name span {
            color: #ff6400;
        }
        .brand-sub {
            font-size: 0.75rem;
            color: #666;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,100,0,0.4), transparent);
            margin: 24px 0;
        }
        .form-label {
            color: #aaa;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .form-control {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        .form-control:focus {
            background: rgba(255,100,0,0.05);
            border-color: rgba(255,100,0,0.5);
            box-shadow: 0 0 0 3px rgba(255,100,0,0.1);
            color: #fff;
        }
        .form-control::placeholder { color: #555; }
        .input-group-text {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-right: none;
            color: #ff6400;
        }
        .input-group .form-control { border-left: none; }
        .btn-login {
            background: linear-gradient(135deg, #ff6400, #cc5000);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 13px;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255,100,0,0.3);
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #ff7a1a, #e05500);
            box-shadow: 0 6px 20px rgba(255,100,0,0.4);
            transform: translateY(-1px);
            color: #fff;
        }
        .alert-danger {
            background: rgba(220,53,69,0.15);
            border: 1px solid rgba(220,53,69,0.3);
            color: #ff6b6b;
            border-radius: 8px;
            font-size: 0.85rem;
        }
        .captcha-wrapper {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            filter: invert(0.1);
        }
        .footer-text {
            text-align: center;
            color: #444;
            font-size: 0.72rem;
            margin-top: 24px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
<div class="grid-bg"></div>
<div class="login-wrapper">
    <div class="login-card">
        <div class="logo-section">
            <img src="{% static 'img/logo.jpg' %}" alt="Master Motors" class="logo-img">
            <div class="brand-name">Master <span>Motors</span></div>
            <div class="brand-sub">Sistema de Gestión del Taller</div>
        </div>

        <div class="divider"></div>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger mb-3">
            <i class="bi bi-exclamation-circle me-2"></i>{{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control"
                           placeholder="Ingresa tu usuario" autofocus required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control"
                           placeholder="Ingresa tu contraseña" required>
                </div>
            </div>
            <div class="captcha-wrapper">
                <div class="g-recaptcha" data-sitekey="6LcEug0tAAAAAOghp7srimh_-6G83S0goZ1X_s4a"></div>
            </div>
            <button type="submit" class="btn btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
            </button>
        </form>

        <div class="footer-text">
            © 2026 Master Motors · Speed · Precision · Est. 2018
        </div>
    </div>
</div>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
