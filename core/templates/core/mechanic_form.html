{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h4 class="fw-bold mb-4">{{ action }} Mecánico</h4>
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nombre *</label>
                        <input type="text" name="first_name" class="form-control" value="{{ obj.first_name|default:'' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Apellido *</label>
                        <input type="text" name="last_name" class="form-control" value="{{ obj.last_name|default:'' }}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Especialidad *</label>
                        <input type="text" name="specialty" class="form-control" value="{{ obj.specialty|default:'' }}" required>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <a href="{% url 'mechanics_list' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success"><i class="bi bi-floppy me-1"></i> Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
