{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h4 class="fw-bold mb-4">{{ action }} Servicio</h4>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">Nombre *</label>
          <input type="text" name="name" class="form-control" placeholder="Ej: Cambio de aceite" maxlength="100" required value="{{ obj.name|default:'' }}">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Precio * <small class="text-muted">(en pesos colombianos)</small></label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input type="number" step="1" min="0" name="price" class="form-control" placeholder="Ej: 150000" value="{{ obj.price|default:'' }}" required>
            <span class="input-group-text">COP</span>
          </div>
        </div>
        <div class="d-flex gap-2 mt-4">
          <a href="{% url 'services_list' %}" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-success"><i class="bi bi-floppy me-1"></i> Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
