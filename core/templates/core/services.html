{% extends 'core/base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="page-title mb-0">Gestión de Servicios</h1>
    <a href="{% url 'service_create' %}" class="btn btn-success"><i class="bi bi-plus-lg me-1"></i> Nuevo Servicio</a>
</div>
<div class="card mb-3 p-3">
    <div class="input-group">
        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
        <input type="text" id="buscador" class="form-control border-start-0 ps-0" placeholder="Buscar por nombre o precio..." oninput="filtrar()">
    </div>
</div>
<div class="card">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr><th>ID</th><th>Servicio</th><th>Precio</th><th>Acciones</th></tr>
            </thead>
            <tbody>
            {% for s in services %}
            <tr class="fila" data-nombre="{{ s.name|lower }}" data-precio="{{ s.price }}">
                <td><span class="badge bg-light text-dark fw-normal">{{ s.id }}</span></td>
                <td>
                    <div class="d-flex align-items-center gap-2">
                        <div class="avatar-service"><i class="bi bi-wrench-adjustable"></i></div>
                        <div class="fw-semibold">{{ s.name }}</div>
                    </div>
                </td>
                <td><span class="badge bg-success-subtle text-success fw-semibold">${{ s.price|floatformat:0 }}</span></td>
                <td>
                    <a href="{% url 'service_edit' s.id %}" class="btn btn-sm btn-outline-success me-1"><i class="bi bi-pencil"></i></a>
                    <a href="{% url 'service_delete' s.id %}" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></a>
                </td>
            </tr>
            {% endfor %}
            </tbody>
        </table>
        <div id="sinResultados" class="text-center py-5 text-muted" style="display:none;">
            <i class="bi bi-search fs-1 d-block mb-2"></i>
            No se encontraron servicios.
        </div>
    </div>
</div>
<style>
.avatar-service { width:34px; height:34px; border-radius:50%; background-color:#2a9d8f; color:white; display:flex; align-items:center; justify-content:center; font-size:0.9rem; flex-shrink:0; }
.bg-success-subtle { background-color:#dcfce7; }
</style>
<script>
function filtrar() {
    const q = document.getElementById("buscador").value.toLowerCase().trim();
    const filas = document.querySelectorAll(".fila");
    let visibles = 0;
    filas.forEach(fila => {
        const coincide = fila.dataset.nombre.includes(q) || fila.dataset.precio.includes(q);
        fila.style.display = coincide ? "" : "none";
        if (coincide) visibles++;
    });
    document.getElementById("sinResultados").style.display = visibles === 0 ? "block" : "none";
}
</script>
{% endblock %}
