{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card p-4">
            <h4 class="fw-bold mb-1"><i class="bi bi-car-front me-2 text-success"></i>{{ action }} Vehículo</h4>
            <p class="text-muted small mb-4">Completa los datos del vehículo y asígnalo a un cliente.</p>
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label fw-semibold">Cliente <span class="text-danger">*</span></label>
                        <div class="position-relative">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" id="clienteBuscar" class="form-control"
                                       placeholder="Buscar por nombre o teléfono..."
                                       autocomplete="off"
                                       value="{% if obj %}{{ obj.customer.first_name }} {{ obj.customer.last_name }}{% endif %}">
                            </div>
                            <div id="clienteSugerencias" class="list-group position-absolute w-100 shadow"
                                 style="z-index:999; display:none; max-height:200px; overflow-y:auto;"></div>
                        </div>
                        <input type="hidden" name="customer" id="clienteId" value="{% if obj %}{{ obj.customer_id }}{% endif %}">
                        <div class="form-text">Escribe el nombre o teléfono del cliente.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Marca <span class="text-danger">*</span></label>
                        <input type="text" name="brand" class="form-control"
                               placeholder="Ej: Toyota, Chevrolet, Renault"
                               maxlength="120" required
                               value="{{ obj.brand|default:'' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Modelo <span class="text-danger">*</span></label>
                        <input type="text" name="model" class="form-control"
                               placeholder="Ej: Corolla, Spark, Logan"
                               maxlength="50" required
                               value="{{ obj.model|default:'' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Placa <span class="text-danger">*</span></label>
                        <input type="text" name="plate" class="form-control"
                               pattern="[A-Za-z]{3}[0-9]{3}|[A-Za-z]{2}[0-9]{4}"
                               title="Formato válido: ABC123 (carros) o AB1234 (motos)"
                               placeholder="Ej: ABC123 o AB1234"
                               maxlength="6" minlength="6"
                               style="text-transform:uppercase"
                               required
                               value="{{ obj.plate|default:'' }}">
                        <div class="form-text">6 caracteres: ABC123 (carro) o AB1234 (moto).</div>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <a href="{% url 'vehicles_list' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success"><i class="bi bi-floppy me-1"></i> Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
const clientes = [
    {% for c in customers %}
    { id: {{ c.id }}, nombre: "{{ c.first_name }} {{ c.last_name }}", telefono: "{{ c.phone }}" },
    {% endfor %}
];

document.getElementById('clienteBuscar').addEventListener('input', function() {
    const q = this.value.toLowerCase().trim();
    const caja = document.getElementById('clienteSugerencias');
    document.getElementById('clienteId').value = '';
    caja.innerHTML = '';
    if (q.length < 2) { caja.style.display = 'none'; return; }

    const coincidencias = clientes.filter(c =>
        c.nombre.toLowerCase().includes(q) || c.telefono.includes(q)
    ).slice(0, 8);

    if (coincidencias.length === 0) { caja.style.display = 'none'; return; }

    coincidencias.forEach(c => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'list-group-item list-group-item-action d-flex justify-content-between';
        item.innerHTML = `<span><i class="bi bi-person me-2 text-success"></i>${c.nombre}</span>
                          <span class="text-muted small">${c.telefono}</span>`;
        item.onclick = () => {
            document.getElementById('clienteBuscar').value = c.nombre;
            document.getElementById('clienteId').value = c.id;
            caja.style.display = 'none';
        };
        caja.appendChild(item);
    });
    caja.style.display = 'block';
});

document.addEventListener('click', function(e) {
    if (!e.target.closest('#clienteBuscar') && !e.target.closest('#clienteSugerencias')) {
        document.getElementById('clienteSugerencias').style.display = 'none';
    }
});
</script>
{% endblock %}
