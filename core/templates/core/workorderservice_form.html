{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h4 class="fw-bold mb-4">Asociar Servicio a Orden</h4>
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">Orden de Trabajo *</label>
                        <select name="workorder" class="form-select" required>
                            <option value="">Seleccione una orden</option>
                            {% for w in workorders %}
                            <option value="{{ w.id }}">Orden #{{ w.id }} - {{ w.vehicle.brand }} {{ w.vehicle.plate }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Servicio *</label>
                        <select name="service" class="form-select" required>
                            <option value="">Seleccione un servicio</option>
                            {% for s in services %}
                            <option value="{{ s.id }}">{{ s.name }} - ${{ s.price }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <a href="{% url 'workorderservices_list' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success"><i class="bi bi-floppy me-1"></i> Agregar Servicio</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
