{% extends 'core/base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="page-title mb-0">Repuestos de Órdenes</h1>
    <a href="{% url 'workordersparepart_create' %}" class="btn btn-success"><i class="bi bi-plus-lg me-1"></i> Agregar Repuesto</a>
</div>
<div class="card">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-light"><tr><th>ID</th><th>Orden</th><th>Repuesto</th><th>Cantidad</th><th>Acciones</th></tr></thead>
            <tbody>
            {% for i in items %}
            <tr>
                <td>{{ i.id }}</td>
                <td>Orden #{{ i.workorder.id }} - {{ i.workorder.vehicle.brand }}</td>
                <td>{{ i.sparepart.name }}</td>
                <td>{{ i.quantity }}</td>
                <td>
                    <a href="{% url 'workordersparepart_delete' i.id %}" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></a>
                </td>
            </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
